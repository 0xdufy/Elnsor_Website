<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>تواصل معنا | شركة النسور للأعلاف</title>
    <meta name="description" content="اطلب عرض سعر من شركة النسور للأعلاف عبر واتساب." />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="alternate" hreflang="en" href="en/contact.html" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-row">
        <a class="wordmark" href="index.html"
          ><strong>شركة النسور للأعلاف</strong><small>AL NESOUR FEEDS</small></a
        >
        <nav class="main-nav">
          <a href="index.html">الرئيسية</a><a href="about.html">من نحن</a
          ><a href="products.html">المنتجات</a><a href="services.html">خدماتنا</a
          ><a aria-current="page" href="contact.html">تواصل معنا</a>
        </nav>
        <div class="header-actions"><a class="lang-link" href="en/contact.html">EN</a></div>
      </div>
    </header>
    <main>
      <section class="page-hero">
        <div class="container">
          <div class="eyebrow">تواصل معنا</div>
          <h1>اطلب سعر اليوم عبر واتساب</h1>
          <p>أرسل تفاصيل احتياجك وسنرتب رسالتك مباشرة عبر واتساب.</p>
        </div>
      </section>
      <section class="section">
        <div class="container quote-layout">
          <aside class="contact-panel">
            <h2>قنوات التواصل</h2>
            <p>تواصل معنا للاستفسار عن التوفر وسعر اليوم.</p>
            <a class="contact-link tel" href="https://wa.me/201022232052"
              >+20 10 2223 2052<small>WhatsApp</small></a
            ><a class="contact-link" href="https://www.facebook.com/AlNesourFeeds">Facebook</a
            ><a class="contact-link" href="https://maps.app.goo.gl/C7hu8ZJvP3u15MHq7"
              >موقعنا على الخريطة</a
            >
          </aside>
          <form class="quote-form" data-quote-form>
            <div class="form-grid">
              <div class="field">
                <label for="name">الاسم *</label><input id="name" name="name" required />
              </div>
              <div class="field">
                <label for="company">اسم الشركة / المزرعة</label
                ><input id="company" name="company" />
              </div>
              <div class="field">
                <label for="client">نوع العميل *</label
                ><select id="client" name="client" required>
                  <option value="">اختر</option>
                  <option>تاجر</option>
                  <option>مصنع أعلاف</option>
                  <option>مزرعة كبيرة</option>
                  <option>أخرى</option>
                </select>
              </div>
              <div class="field">
                <label for="product">المنتج *</label
                ><select id="product" name="product" required>
                  <option value="">اختر</option>
                  <option>قشر الصويا</option>
                  <option>زيت منزوع</option>
                  <option>علف مواشي</option>
                  <option>علف بط</option>
                  <option>علف غنم</option>
                </select>
              </div>
              <div class="field">
                <label for="quantity">الكمية المطلوبة</label><input id="quantity" name="quantity" />
              </div>
              <div class="field">
                <label for="governorate">المحافظة *</label
                ><input id="governorate" name="governorate" required />
              </div>
              <div class="field full">
                <label for="notes">تفاصيل إضافية</label
                ><textarea id="notes" name="notes"></textarea>
              </div>
            </div>
            <p class="form-status" data-form-status aria-live="polite"></p>
            <button class="btn btn-primary" type="submit">تابع عبر واتساب</button>
          </form>
        </div>
      </section>
    </main>
    <script src="assets/js/quote.js" defer></script>
  </body>
</html>
